<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#101827" />
  <meta name="description" content="Choose a game to play: Auto-Battler or Flip or Skip." />
  <title>Choose Your Game</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7f8fc;
      --muted: #aab4c5;
      --panel: rgba(24, 35, 53, .82);
      --line: rgba(255, 255, 255, .12);
    }
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse at 14% 10%, rgba(75, 124, 255, .23), transparent 38%),
        radial-gradient(ellipse at 88% 88%, rgba(218, 160, 76, .16), transparent 34%),
        #101827;
    }
    main { width: min(100%, 960px); }
    .eyebrow {
      margin: 0 0 12px;
      color: #9fb7ff;
      font-size: .76rem;
      font-weight: 700;
      letter-spacing: .18em;
      text-align: center;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(2.35rem, 7vw, 4.3rem);
      letter-spacing: -.055em;
      line-height: 1.05;
      text-align: center;
    }
    .intro {
      margin: 16px auto 42px;
      max-width: 520px;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
      text-align: center;
    }
    .games { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .game {
      --accent: #8aa7ff;
      position: relative;
      display: flex;
      min-height: 290px;
      flex-direction: column;
      align-items: flex-start;
      overflow: hidden;
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      box-shadow: 0 20px 55px rgba(0, 0, 0, .22);
      text-decoration: none;
      transition: transform .18s ease, border-color .18s ease, background .18s ease;
    }
    .game::before {
      position: absolute;
      top: -72px;
      right: -55px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: var(--accent);
      content: "";
      filter: blur(80px);
      opacity: .22;
      pointer-events: none;
    }
    .game:hover, .game:focus-visible {
      transform: translateY(-5px);
      border-color: color-mix(in srgb, var(--accent), white 18%);
      background: rgba(30, 43, 64, .96);
      outline: none;
    }
    .game:focus-visible { box-shadow: 0 0 0 3px var(--accent), 0 20px 55px rgba(0, 0, 0, .22); }
    .auto { --accent: #89a5ff; }
    .flip { --accent: #e7bd69; }
    .icon {
      display: grid;
      width: 58px;
      height: 58px;
      place-items: center;
      margin-bottom: 27px;
      border: 1px solid color-mix(in srgb, var(--accent), transparent 55%);
      border-radius: 17px;
      background: color-mix(in srgb, var(--accent), transparent 88%);
      color: var(--accent);
      font-size: 1.8rem;
    }
    h2 { margin: 0 0 9px; font-size: 1.65rem; letter-spacing: -.035em; }
    .description { max-width: 34ch; margin: 0; color: var(--muted); line-height: 1.55; }
    .launch {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-top: auto;
      padding-top: 24px;
      color: var(--accent);
      font-size: .92rem;
      font-weight: 750;
    }
    .arrow { font-size: 1.15rem; transition: transform .18s ease; }
    .game:hover .arrow { transform: translateX(4px); }
    footer { margin-top: 34px; color: #778398; font-size: .8rem; text-align: center; }
    @media (max-width: 640px) {
      .intro { margin-bottom: 28px; }
      .games { grid-template-columns: 1fr; gap: 14px; }
      .game { min-height: 245px; padding: 23px; }
      .icon { margin-bottom: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Julian’s Games</p>
    <h1>Choose your game</h1>
    <p class="intro">Pick a game and jump right in.</p>

    <nav class="games" aria-label="Available games">
      <a class="game auto" href="./autobattler/" aria-label="Play Auto-Battler">
        <span class="icon" aria-hidden="true">⚔</span>
        <h2>Auto-Battler</h2>
        <p class="description">Build your team, plan your formation, and battle your way to victory.</p>
        <span class="launch">Play Auto-Battler <span class="arrow" aria-hidden="true">→</span></span>
      </a>
      <a class="game flip" href="./flip_or_skip/" aria-label="Play Flip or Skip">
        <span class="icon" aria-hidden="true">♠</span>
        <h2>Flip or Skip</h2>
        <p class="description">Test your luck and make the right call in this card game.</p>
        <span class="launch">Play Flip or Skip <span class="arrow" aria-hidden="true">→</span></span>
      </a>
    </nav>
    <footer>Choose a game to open it.</footer>
  </main>
</body>
</html>
